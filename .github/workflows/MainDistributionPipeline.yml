#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

# OIDC token needed for AWS credentials in the deploy job.
permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: anofox_statistics
      enable_rust: true
      reduced_ci_mode: disabled
      # Windows is not shipped for this extension — both deploy jobs below
      # already exclude these two archs, so building them produces nothing
      # publishable while reliably failing CI:
      #   * windows_amd64_mingw — vcpkg's openssl build fetches MSYS2 packages
      #     by exact version, and the version pinned by the ci-tools vcpkg
      #     baseline (libtool-2.4.7-4) has been deleted from every MSYS2
      #     mirror (they retain only current versions, now 2.5.4-x) => 404.
      #     Not fixable here: vcpkg comes from extension-ci-tools.
      #   * windows_amd64 — DuckDB's vendored third_party/fmt is flaky on MSVC
      #     (see the deploy job comment below).
      exclude_archs: "windows_amd64;windows_amd64_mingw"

  duckdb-stable-smoke-test:
    name: Smoke test (v1.5.6)
    needs: duckdb-stable-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.5.6
      extension_name: anofox_statistics
      exclude_archs: 'windows_amd64;windows_amd64_mingw'

  duckdb-stable-deploy:
    name: Deploy extension binaries (v1.5.6)
    needs: [duckdb-stable-build, duckdb-stable-smoke-test]
    # Deploy only artifacts that passed the smoke test. (Previously this was
    # `!cancelled()` so a flaky Windows build leg could not block Linux/macOS
    # deploys; Windows is now excluded from this build entirely — see the
    # separate non-blocking windows-msvc-test job — and `!cancelled()` alone
    # let a FAILED smoke test fall through to deploy, contradicting
    # _extension_smoke_test.yml's contract that a broken artifact blocks
    # distribution.)
    if: ${{ !cancelled() && needs.duckdb-stable-smoke-test.result == 'success' }}
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: anofox_statistics
      exclude_archs: "windows_amd64;windows_amd64_mingw"
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}

  wasm-runtime-test:
    name: WASM runtime test (Node harness, v1.5.6 wasm_eh)
    # A green wasm build only proves the extension COMPILES + LINKS. This job
    # proves it actually LOADS and RUNS in DuckDB-Wasm — the gap described in
    # query.farm's "Testing DuckDB WASM Extensions". It consumes the wasm_eh
    # artifact the build job already produced and runs test/wasm/run.mjs against
    # it. Gating (no continue-on-error) per milestone requirement TEST-02.
    needs: duckdb-stable-build
    if: ${{ !cancelled() && needs.duckdb-stable-build.result == 'success' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Submodules not needed: the harness only uses test/ (this repo) + the
        # downloaded .wasm; skipping them keeps this leg fast.

      - name: Download built wasm_eh extension
        uses: actions/download-artifact@v4
        with:
          name: anofox_statistics-v1.5.6-extension-wasm_eh
          path: wasm-artifact

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install harness dependencies
        run: npm --prefix test/wasm install

      - name: Run DuckDB-Wasm load + runtime harness
        run: |
          EXT=$(find wasm-artifact -name 'anofox_statistics.duckdb_extension.wasm' | head -1)
          if [ -z "$EXT" ]; then echo "::error::built wasm extension not found in artifact"; exit 1; fi
          echo "Testing extension: $EXT"
          node test/wasm/run.mjs --all --ext "$EXT"

  duckdb-stable-windows-msvc-test:
    name: Windows MSVC build + sqllogictests (non-blocking)
    # windows_amd64 (MSVC) was excluded from the shipping build in #84/#106
    # because DuckDB's vendored third_party/fmt was flaky on MSVC (DuckDB
    # v1.5.3 era) — a flake, not a deterministic failure. windows_amd64_mingw
    # stays excluded everywhere: its vcpkg openssl port fetches an MSYS2
    # libtool version that no longer exists on any mirror.
    # This job re-enables MSVC for TESTING ONLY: it builds just windows_amd64
    # and runs the full sqllogictest suite on it. Nothing `needs` it, so a
    # flake here never blocks the smoke tests or the deploy, and its artifact
    # carries a postfix so it can never be picked up by the deploy job.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: anofox_statistics
      enable_rust: true
      reduced_ci_mode: disabled
      artifact_postfix: "-msvc-test"
      exclude_archs: "linux_amd64;linux_arm64;linux_amd64_musl;osx_amd64;osx_arm64;windows_amd64_mingw;windows_amd64_rtools;windows_arm64;wasm_mvp;wasm_eh;wasm_threads"

  sanitizer-tests:
    name: ASAN + UBSAN sqllogictests (Linux debug, non-blocking)
    # Debug build of DuckDB + the extension with AddressSanitizer and
    # UndefinedBehaviorSanitizer (DuckDB's CMake enables both for
    # CMAKE_BUILD_TYPE=Debug by default via ENABLE_SANITIZER / ENABLE_UBSAN;
    # passed explicitly below so a future default change is visible). The
    # Rust FFI crate is built normally by Corrosion (uninstrumented) and linked
    # in; ASAN still catches C++-side misuse of FFI buffers.
    # Separate from the release pipeline: nothing `needs` this job and it is
    # continue-on-error, so it never blocks release artifacts.
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    continue-on-error: true
    env:
      GEN: ninja
      # CMAKE_CXX_STANDARD=17: the extension's CMakeLists compiles its sources
      # as C++17 while DuckDB defaults to C++11. At -O0 the extension objects
      # then emit LogicalType::VARCHAR/BOOLEAN/... as C++17 inline variables
      # (COMDAT) while libduckdb_static.a has the C++11 strong out-of-line
      # definitions, and linking the debug loadable extension fails with
      # "multiple definition of duckdb::LogicalType::VARCHAR". Building DuckDB
      # as C++17 too makes both sides agree. (Release builds never ODR-use
      # these constants, so they are unaffected.)
      EXT_FLAGS: "-DENABLE_SANITIZER=TRUE -DENABLE_UBSAN=TRUE -DCMAKE_CXX_STANDARD=17"
      ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sanitizer-debug-${{ runner.os }}
          max-size: 2G

      - name: Build debug (ASAN + UBSAN)
        run: make debug

      - name: Run sqllogictests under sanitizers
        run: ./build/debug/test/unittest "test/*"

  duckdb-lts-build:
    name: Build extension binaries (DuckDB LTS v1.4.5)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.4-andium
    with:
      duckdb_version: v1.4.5
      ci_tools_version: v1.4-andium
      extension_name: anofox_statistics
      enable_rust: true
      reduced_ci_mode: disabled
      # Same rationale as the stable build job above — Windows is never
      # deployed, and the mingw leg 404s on a deleted MSYS2 libtool package.
      exclude_archs: "windows_amd64;windows_amd64_mingw"

  duckdb-lts-smoke-test:
    name: Smoke test (v1.4.5)
    needs: duckdb-lts-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.4.5
      extension_name: anofox_statistics
      exclude_archs: 'windows_amd64;windows_amd64_mingw'

  duckdb-lts-deploy:
    name: Deploy extension binaries (v1.4.5 LTS)
    needs: [duckdb-lts-build, duckdb-lts-smoke-test]
    # Same gating as the stable deploy: only smoke-tested artifacts ship.
    if: ${{ !cancelled() && needs.duckdb-lts-smoke-test.result == 'success' }}
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.4.5
      ci_tools_version: v1.4-andium
      extension_name: anofox_statistics
      exclude_archs: "windows_amd64;windows_amd64_mingw"
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}

  build-and-test-rust:
    name: Build and test Rust components
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build Rust library
        run: cargo build --release

      - name: Run Rust tests
        run: cargo test --all-features

      # Coverage report (non-blocking): an lcov + HTML report uploaded as an
      # artifact. Failures here never fail the job.
      - name: Install llvm-tools + cargo-llvm-cov
        continue-on-error: true
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked

      - name: Rust coverage (cargo llvm-cov)
        continue-on-error: true
        run: |
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage-html
          cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: Upload coverage report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: |
            lcov.info
            coverage-html
            coverage-summary.txt
          if-no-files-found: ignore
